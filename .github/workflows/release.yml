name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose notes should be regenerated
        required: true
        type: string

permissions:
  contents: read

jobs:
  validation:
    if: github.event_name == 'push'
    uses: ./.github/workflows/validate.yml

  package:
    if: github.event_name == 'push'
    needs: validation
    uses: ./.github/workflows/platforms.yml
    with:
      artifact-prefix: xbde-release
      verify-tag: true

  publish:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v8
        with:
          pattern: xbde-release-*
          path: dist
          merge-multiple: true

      - name: Verify platform archives
        shell: bash
        run: |
          set -euo pipefail
          version="$(<VERSION)"
          for rid in win-x64 osx-arm64 osx-x64 linux-x64; do
            test -f "dist/xbde-save-editor-v$version-$rid.zip"
          done
          (cd dist && sha256sum ./*.zip > SHA256SUMS && sha256sum -c SHA256SUMS)

      - name: Generate changelog and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes changelogithub@15.0.5 --to "$GITHUB_REF_NAME"

      - name: Upload release files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber

      - name: Verify release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-download
          gh release download "$GITHUB_REF_NAME" --dir release-download
          (cd release-download && sha256sum -c SHA256SUMS)

  refresh-notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Regenerate changelog for existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: npx --yes changelogithub@15.0.5 --to "$RELEASE_TAG"
